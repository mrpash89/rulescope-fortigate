name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      draft-release:
        description: Create a draft GitHub Release (select an existing vVERSION tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - os: macos-15
            python: '3.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  windows:
    name: Windows compatibility (informational)
    runs-on: windows-2025
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: python -m unittest discover -s tests -v

  prerelease:
    name: Python prerelease (informational)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.16'
          allow-prereleases: true
      - run: python -m unittest discover -s tests -v

  benchmark:
    name: Synthetic coverage benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Run 10,000-policy benchmark
        shell: bash
        run: python tests/bench.py 10000 | tee -a "$GITHUB_STEP_SUMMARY"

  package:
    name: Build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: python -m pip install build
      # build creates the sdist, then builds the wheel from that sdist.
      - run: python -m build
      - name: Checksum distributions
        working-directory: dist
        run: sha256sum ./*.whl ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  package-smoke:
    name: Installed package (Python ${{ matrix.python }})
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - run: sha256sum --check SHA256SUMS
        working-directory: dist
      - run: python tests/package_smoke.py dist

  ci:
    name: ci
    if: always()
    needs: [tests, benchmark, package, package-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every mandatory job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          jobs = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in jobs.items() if job['result'] != 'success'}
          if failed:
              sys.exit(f'Required jobs did not pass: {failed}')
          print('All required checks passed.')
          PY

  draft-release:
    name: Prepare draft release
    if: github.event_name == 'workflow_dispatch' && inputs.draft-release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Require a version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo 'Select an existing vVERSION tag.'; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - run: sha256sum --check SHA256SUMS
        working-directory: dist
      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import email, os, pathlib, zipfile
          wheels = list(pathlib.Path('dist').glob('*.whl'))
          assert len(wheels) == 1, 'Expected one wheel'
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata = next(n for n in wheel.namelist() if n.endswith('.dist-info/METADATA'))
              version = email.message_from_bytes(wheel.read(metadata))['Version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match the package version'
          PY
      - name: Create draft with the tested distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --verify-tag --draft --title "$RELEASE_TAG" --notes "Built and tested in $RUN_URL. Review this draft before publishing."
