[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rulescope"
version = "0.4.1"
description = "FortiGate rule base audit, remediation and change tracking (read-only, on-prem, zero dependencies)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Pavel Simanovski" }]
license = { text = "Apache-2.0" }
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking :: Firewalls",
]

[project.scripts]
rulescope = "rulescope.cli:main"

[tool.setuptools]
packages = ["rulescope"]
