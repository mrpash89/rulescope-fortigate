# Serve the fleet dashboard to administrators only. The reports describe firewall weaknesses.
# htpasswd: sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/rulescope.htpasswd youruser
# The fleet service writes its files for the rulescope user and group only (UMask=0027):
#   sudo usermod -aG rulescope www-data && sudo systemctl restart nginx
server {
    listen 443 ssl;
    server_name rulescope.example.internal;
    ssl_certificate     /etc/ssl/certs/rulescope.crt;
    ssl_certificate_key /etc/ssl/private/rulescope.key;

    allow 192.0.2.0/24;          # management network - replace
    deny  all;
    auth_basic           "rulescope";
    auth_basic_user_file /etc/nginx/rulescope.htpasswd;

    root /var/lib/rulescope/site;
    index index.html;
    add_header X-Content-Type-Options nosniff;
    add_header Cache-Control "no-store";
    location ~ \.json$ { deny all; }
}
